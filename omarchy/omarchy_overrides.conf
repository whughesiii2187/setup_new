# bind = $mainMod shift, right, resizeactive, 10 0
# bind = $mainMod shift, up, resizeactive, 0 -10
# bind = $mainMod shift, down, resizeactive, 0 10

## Input changes ##
# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  # kb_layout = us,dk,eu
  kb_layout = us
  kb_options = compose:caps # ,grp:alts_toggle

  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 600

  # Start with numlock on by default
  numlock_by_default = true

  # Increase sensitivity for mouse/trackpad (default: 0)
  sensitivity = 0.35

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4
  }

  follow_mouse = 0
  natural_scroll = true
}

# Scroll nicely in the terminal
# windowrule = scrolltouchpad 1.5, class:(Alacritty|kitty)
# windowrule = scrolltouchpad 0.2, class:com.mitchellh.ghostty

decoration {
    active_opacity = 0.8
    inactive_opacity = 0.8
    dim_inactive = false
  }

exec-once = hyprdynamicmonitors run

$terminal = ghostty
$browser = firefox

# Move focus with SUPER + arrow keys
bindd = SUPER ALT, H, Move window focus left, movefocus, l
bindd = SUPER ALT, L, Move window focus right, movefocus, r
bindd = SUPER ALT, J, Move window focus up, movefocus, u
bindd = SUPER ALT, K, Move window focus down, movefocus, d

# Move workspaces to other monitors
bindd = SUPER SHIFT ALT, H, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT ALT, L, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT ALT, J, Move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT ALT, K, Move workspace to down monitor, movecurrentworkspacetomonitor, d

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
bindd = SUPER SHIFT, H, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, L, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, J, Swap window up, swapwindow, u
bindd = SUPER SHIFT, K, Swap window down, swapwindow, d

