# See https://wiki.hyprland.org/Configuring/Variables/ for more

# Window settings
general {
  gaps_in = 5
  gaps_out = 5
  border_size = 3
  col.active_border = rgba(255,165,0,1) 45deg
  col.inactive_border = rgba(65,105,225,1)
  layout = dwindle
  resize_on_border = true
}

# Decoration #
decoration {
  rounding = 0 # I like squares
  blur {
    enabled = true
    size = 3
    passes = 1
  }
  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }
}
## Gestures
# gestures {
# workspace_swipe = true
# }

# Inputs #
input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options =
  kb_rules =

  repeat_rate = 30
  repeat_delay = 600

  numlock_by_default = true

  follow_mouse = 0

  mouse_refocus = true

  touchpad {
    natural_scroll = true
  }

  natural_scroll = true

  sensitivity = 0
  accel_profile = flat
}

misc {
  mouse_move_focuses_monitor = false
  disable_hyprland_logo = true
  disable_splash_rendering = true
  vfr = true
}

# Scroll nicely in the terminal
windowrule = scrolltouchpad 1.5, class:(Alacritty|kitty)
windowrule = scrolltouchpad 0.2, class:com.mitchellh.ghostty

# Layouts #
dwindle {
  # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
  pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # you probably want this
}

master {
  # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
  # new_status = master
}


# Key bindings
# SUPER KEY
$mainMod = SUPER
$SCRIPTS = ~/.config/hypr/scripts

# Applications
bind = $mainMod, RETURN, exec, kitty # Open the terminal
bind = $mainMod, B, exec, zen-browser # Open the browser
bind = $mainMod CTRL, B, exec, zen-browser --private-window # Open the browser with private window
# bind = $mainMod, E, exec, $SETTINGS/filemanager.sh # Open the filemanager
# bind = $mainMod CTRL, E, exec, $SETTINGS/emojipcker.sh # Open the emoji picker
# bind = $mainMod CTRL, C, exec, $SETTINGS/calculator.sh # Open the calculator
# bind = $mainMod, S, exec, kitty -e spotify_player # Open Spotify Plater

# Display
bind = $mainMod SHIFT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}") # Increase display zoom
bind = $mainMod SHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}") # Decrease display zoom
bind = $mainMod SHIFT, Z, exec, hyprctl keyword cursor:zoom_factor 1 # Reset display zoom

# Windows
bind = $mainMod, Q, killactive # Kill active window
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill # Quit active window and all open instances
bind = $mainMod, F, fullscreen, 0 # Set active window to fullscreen
# bind = $mainMod, M, fullscreen, 1 # Maximize Window
bind = $mainMod, T, togglefloating # Toggle active windows into floating mode
bind = $mainMod SHIFT, T, workspaceopt, allfloat # Toggle all windows into floating mode
bind = $mainMod, J, togglesplit # Toggle split vert to horiz
bind = $mainMod, K, swapsplit # Swapsplit left/right up/down
bind = $mainMod, left, movefocus, l # Move focus left
bind = $mainMod, right, movefocus, r # Move focus right
bind = $mainMod, up, movefocus, u # Move focus up
bind = $mainMod, down, movefocus, d # Move focus down
bindm = $mainMod, mouse:272, movewindow # Move window with the mouse
bindm = $mainMod, mouse:273, resizewindow # Resize window with the mouse
bind = $mainMod SHIFT, right, resizeactive, 100 0 # Increase window width with keyboard
bind = $mainMod SHIFT, left, resizeactive, -100 0 # Reduce window width with keyboard
bind = $mainMod SHIFT, down, resizeactive, 0 100 # Increase window height with keyboard
bind = $mainMod SHIFT, up, resizeactive, 0 -100 # Reduce window height with keyboard
# bind = $mainMod, G, togglegroup # Toggle window group
bind = $mainMod ALT, left, swapwindow, l # Swap tiled window left
bind = $mainMod ALT, right, swapwindow, r # Swap tiled window right
bind = $mainMod ALT, up, swapwindow, u # Swap tiled window up
bind = $mainMod ALT, down, swapwindow, d # Swap tiled window down
# binde = ALT,Tab,cyclenext # Cycle between windows
# binde = ALT,Tab,bringactivetotop # Bring active window to the top

# Actions
bind = $mainMod CTRL, R, exec, hyprctl reload                                             # Reload Hyprland configuration
# bind = $mainMod SHIFT, A, exec, $SCRIPTS/toggle-animations.sh                         # Toggle animations
# bind = $mainMod, PRINT, exec, $SCRIPTS/screenshot.sh                                  # Take a screenshot
# bind = $mainMod ALT, F, exec, $SCRIPTS/screenshot.sh --instant                        # Take an instant full-screen screenshot
# bind = $mainMod ALT, S, exec, $SCRIPTS/screenshot.sh --instant-area                   # Take an instant area screenshot
bind = $mainMod CTRL, Q, exec, wleave -l ~/.config/wleave/layout -C ~/.config/wleave/style.css  # Start wleave
# bind = $mainMod SHIFT, W, exec, $SCRIPTS/waypaper.sh --random # Change the wallpaper
# bind = $mainMod CTRL, W, exec, $SCRIPTS/waypaper.sh # Open wallpaper selector
# bind = $mainMod ALT, W, exec, $SCRIPTS/wallpaper-automation.sh                        # Start random wallpaper script
# bind = $mainMod CTRL, RETURN, exec, $SCRIPTS/launcher.sh # Open application launcher
# bind = $mainMod CTRL, K, exec, $SCRIPTS/keybindings.sh # Show keybindings
# bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh # Reload waybar
# bind = $mainMod CTRL, B, exec, ~/.config/waybar/toggle.sh # Toggle waybar
# bind = $mainMod SHIFT, R, exec, $SCRIPTS/loadconfig.sh # Reload hyprland config
# bind = $mainMod, V, exec, $SCRIPTS/cliphist.sh # Open clipboard manager
# bind = $mainMod CTRL, T, exec, ~/.config/waybar/themeswitcher.sh                          # Open waybar theme switcher
# bind = $mainMod ALT, G, exec, $SCRIPTS/gamemode.sh # Toggle game mode
# bind = $mainMod CTRL, L, exec, $SCRIPTS/power.sh lock # Lock Screen
# bind = $mainMod SHIFT, H, exec, $SCRIPTS/hyprshade.sh # Start wlogout
# bind = CTRL, Tab, exec, $SCRIPTS/focus.sh                                   # Open Select Window Menu
bind = $mainMod CTRL, V, exec, $SCRIPTS/toggle_vpn.sh

# Workspaces
bind = $mainMod, 1, workspace, 1 # Open workspace 1
bind = $mainMod, 2, workspace, 2 # Open workspace 2
bind = $mainMod, 3, workspace, 3 # Open workspace 3
bind = $mainMod, 4, workspace, 4 # Open workspace 4
bind = $mainMod, 5, workspace, 5 # Open workspace 5
bind = $mainMod, 6, workspace, 6 # Open workspace 6
bind = $mainMod, 7, workspace, 7 # Open workspace 7
bind = $mainMod, 8, workspace, 8 # Open workspace 8
bind = $mainMod, 9, workspace, 9 # Open workspace 9
bind = $mainMod, 0, workspace, 10 # Open workspace 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move active window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move active window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move active window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move active window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move active window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Move active window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Move active window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Move active window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Move active window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Move active window to workspace 10

bind = $mainMod, Tab, workspace, m+1 # Open next workspace
bind = $mainMod SHIFT, Tab, workspace, m-1 # Open previous workspace

bind = $mainMod CTRL, 1, exec, $SCRIPTS/moveTo.sh 1 # Move all windows to workspace 1
bind = $mainMod CTRL, 2, exec, $SCRIPTS/moveTo.sh 2 # Move all windows to workspace 2
bind = $mainMod CTRL, 3, exec, $SCRIPTS/moveTo.sh 3 # Move all windows to workspace 3
bind = $mainMod CTRL, 4, exec, $SCRIPTS/moveTo.sh 4 # Move all windows to workspace 4
bind = $mainMod CTRL, 5, exec, $SCRIPTS/moveTo.sh 5 # Move all windows to workspace 5
bind = $mainMod CTRL, 6, exec, $SCRIPTS/moveTo.sh 6 # Move all windows to workspace 6
bind = $mainMod CTRL, 7, exec, $SCRIPTS/moveTo.sh 7 # Move all windows to workspace 7
bind = $mainMod CTRL, 8, exec, $SCRIPTS/moveTo.sh 8 # Move all windows to workspace 8
bind = $mainMod CTRL, 9, exec, $SCRIPTS/moveTo.sh 9 # Move all windows to workspace 9
bind = $mainMod CTRL, 0, exec, $SCRIPTS/moveTo.sh 10 # Move all windows to workspace 10

bind = $mainMod, mouse_down, workspace, e+1 # Open next workspace
bind = $mainMod, mouse_up, workspace, e-1 # Open previous workspace
bind = $mainMod CTRL, down, workspace, empty # Open the next empty workspace

# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10% # Increase brightness by 10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%- # Reduce brightness by 10%
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # Increase volume by 5% (max 100% limit also added hold to raise volume)
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # Reduce volume by 5% (min 0% limit also added hold to lower volume)
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle # Toggle mute
bind = , XF86AudioPlay, exec, playerctl play-pause # Audio play pause
bind = , XF86AudioPause, exec, playerctl pause # Audio pause
bind = , XF86AudioNext, exec, playerctl next # Audio next
bind = , XF86AudioPrev, exec, playerctl previous # Audio previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle # Toggle microphone
bind = , XF86Calculator, exec, $SETTINGS/calculator.sh # Open calculator
# bind = , XF86Lock, exec, hyprlock                                                                                                                            # Open screenlock

bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-


# Monitors #
# # See https://wiki.hyprland.org/Configuring/Monitors/
monitor = ,preferred,auto,1

