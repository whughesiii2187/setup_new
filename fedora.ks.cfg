# Fedora Personal Workstation
# Encrypted Btrfs + Snapper
#
# Replace every occurrence of "vda" with the actual target disk if needed.

lang en_US.UTF-8
keyboard --xlayouts=us
timezone America/Chicago --utc

network --bootproto=dhcp --device=link --activate --onboot=on

# Prefer using the installer's repo or booting with:
# inst.repo=https://download.fedoraproject.org/pub/fedora/linux/releases/43/Everything/x86_64/os/
#
# url --mirrorlist=https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=$basearch

ignoredisk --only-use=vda
zerombr
clearpart --all --initlabel --drives=vda

part /boot/efi --fstype=efi --size=600 --fsoptions="umask=0077,shortname=winnt" --ondisk=vda
part /boot     --fstype=ext4 --size=1024 --ondisk=vda
part btrfs.01  --grow --size=8192 --encrypted --luks-version=luks2 --ondisk=vda

#
# Create the Btrfs filesystem FIRST
#
btrfs none --label=fedora btrfs.01

#
# Then create subvolumes
#
btrfs /                        --subvol --name=root                LABEL=fedora
btrfs /home                    --subvol --name=home                LABEL=fedora
btrfs /var/log                 --subvol --name=var_log             LABEL=fedora
btrfs /var/cache               --subvol --name=var_cache           LABEL=fedora
btrfs /var/tmp                 --subvol --name=var_tmp             LABEL=fedora
btrfs /var/lib/containers      --subvol --name=var_lib_containers  LABEL=fedora
btrfs /var/lib/libvirt/images  --subvol --name=var_lib_libvirt     LABEL=fedora

bootloader --boot-drive=vda --timeout=5

firstboot --reconfig

selinux --enforcing
firewall --enabled
services --enabled=NetworkManager

%packages
@core

NetworkManager
curl
git

snapper
python3-dnf-plugin-snapper
libdnf5-plugin-actions

inotify-tools

btrfs-progs
dnf-plugins-core
%end

%post --erroronfail

#
# Basic DNF tuning
#
cat >/etc/dnf/dnf.conf <<EOF
[main]
gpgcheck=True
installonly_limit=3
clean_requirements_on_remove=True
best=True
fastestmirror=True
max_parallel_downloads=10
EOF

#
# Configure Snapper
#
snapper --no-dbus -c root create-config /
mkdir -p /.snapshots
chmod 750 /.snapshots

snapper --no-dbus -c home create-config /home
mkdir -p /home/.snapshots
chmod 750 /home/.snapshots


# CRITICAL: because "root" and "home" are named top-level subvolumes
# (not the SUSE-style flat/@ layout), "snapper create-config" creates
# .snapshots AS A NESTED SUBVOLUME under root/ and home/. A nested
# subvolume is NOT included in a snapshot of its parent, and it is
# NOT reachable once you boot into a different default subvolume
# (e.g. after "snapper rollback", or when GRUB boots you into a
# snapshot). In practice this is what breaks browsing/restoring
# snapshots after a rollback: /.snapshots inside the newly-booted
# subvolume is just an empty leftover directory.
#
# Fix: bind each .snapshots mountpoint directly to its subvolume by
# an explicit top-level path, independent of whichever subvolume is
# currently the default/root. This keeps snapshot history visible
# and restorable no matter what you've booted into.
#
cat >>/etc/fstab <<EOF
LABEL=fedora /.snapshots       btrfs subvol=root/.snapshots,compress=zstd:1 0 0
LABEL=fedora /home/.snapshots  btrfs subvol=home/.snapshots,compress=zstd:1 0 0
EOF
systemctl daemon-reload
mount -a
restorecon -R /.snapshots /home/.snapshots
 
#
# Make sure both configs are actually picked up by the timeline and
# cleanup timers (create-config doesn't reliably register "home" here).
#
if grep -q '^SNAPPER_CONFIGS=' /etc/sysconfig/snapper; then
    sed -i 's/^SNAPPER_CONFIGS=.*/SNAPPER_CONFIGS="root home"/' /etc/sysconfig/snapper
else
    echo 'SNAPPER_CONFIGS="root home"' >> /etc/sysconfig/snapper
fi
 
#
# python3-dnf-plugin-snapper only hooks the legacy dnf4 codepath.
# Fedora defaults to dnf5, which uses libdnf5 plugins instead, so
# without this, "dnf install/update/remove" won't create pre/post
# transaction snapshots even though the package is installed.
#
mkdir -p /etc/dnf/libdnf5-plugins/actions.d
cat >/etc/dnf/libdnf5-plugins/actions.d/snapper.actions <<'EOF'
pre_transaction::::/usr/bin/sh -c echo\ "tmp.snapper_desc=$(ps\ -o\ command\ --no-headers\ -p\ '${pid}')"
pre_transaction::::/usr/bin/sh -c echo\ "tmp.snapper_pre_number=$(snapper\ create\ -t\ pre\ -p\ -d\ '${tmp.snapper_desc}')"
post_transaction::::/usr/bin/sh -c [\ -n\ "${tmp.snapper_pre_number}"\ ]\ &&\ snapper\ create\ -t\ post\ --pre-number\ "${tmp.snapper_pre_number}"\ -d\ "${tmp.snapper_desc}";\ echo\ tmp.snapper_pre_number\ ;\ echo\ tmp.snapper_desc
EOF

#
# Enable automatic snapshots
#
systemctl enable snapper-timeline.timer
systemctl enable snapper-cleanup.timer

# Baseline "day 0" snapshot for both configs, so there's always a
# known-good restore point from first boot.
#
snapper --no-dbus -c root create --description "initial install"
snapper --no-dbus -c home create --description "initial install"

#
# Install grub-btrfs
#
# Replace this with your preferred COPR.
#
dnf -y copr enable pego-copr/grub-btrfs
dnf -y install grub-btrfs
systemctl enable grub-btrfsd.service

#
# Rebuild GRUB config
#
grub2-mkconfig -o /boot/grub2/grub.cfg

%end

reboot
