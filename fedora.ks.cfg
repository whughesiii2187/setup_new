# Fedora Personal Workstation
# Encrypted Btrfs + Snapper
#
# Replace every occurrence of "nvme0n1" with the actual target disk if needed.

lang en_US.UTF-8
keyboard --xlayouts=us
timezone America/Chicago --utc

network --bootproto=dhcp --device=link --activate --onboot=on

ignoredisk --only-use=nvme0n1
zerombr
clearpart --all --initlabel --drives=nvme0n1

part /boot/efi --fstype=efi --size=600 --fsoptions="umask=0077,shortname=winnt" --ondisk=nvme0n1
part /boot     --fstype=ext4 --size=1024 --ondisk=nvme0n1
part btrfs.01  --grow --size=8192 --encrypted --luks-version=luks2 --ondisk=nvme0n1

#
# Create the Btrfs filesystem FIRST
#
btrfs none --label=linux btrfs.01

#
# Then create subvolumes
#
# This layout (label + subvolume names) is shared with arch.install.sh so
# scripts/install_snapper.sh works identically on either distro.
btrfs /                        --subvol --name=root                LABEL=linux
btrfs /home                    --subvol --name=home                LABEL=linux
btrfs /var/log                 --subvol --name=var_log             LABEL=linux
btrfs /var/cache               --subvol --name=var_cache           LABEL=linux
btrfs /var/tmp                 --subvol --name=var_tmp             LABEL=linux
btrfs /var/lib/containers      --subvol --name=var_lib_containers  LABEL=linux
btrfs /var/lib/libvirt/images  --subvol --name=var_lib_libvirt     LABEL=linux

bootloader --boot-drive=nvme0n1 --timeout=5

firstboot --reconfig

selinux --enforcing
firewall --enabled
services --enabled=NetworkManager

%packages
@core

NetworkManager
NetworkManager-wifi
wireless-regdb
iwlwifi-mvm-firmware

curl
git
tar
gzip

inotify-tools

btrfs-progs
dnf-plugins-core
%end

#
# DNF tuning and Snapper/grub-btrfs setup are handled post-boot by
# scripts/install_fedora.sh and scripts/install_snapper.sh (this project's
# post-install scripts), not here, since they don't need to happen during
# the install itself.
#

reboot
